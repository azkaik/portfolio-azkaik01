<!doctype html>
<html lang="id" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/azkaik-logo.svg?v=3" />
    <link rel="shortcut icon" type="image/svg+xml" href="/azkaik-logo.svg?v=3" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ikhwanul Azka (Azkaik) — Animator / Programmer</title>
    <meta
      name="description"
      content="Portofolio pribadi Ikhwanul Azka (Azkaik) — Animator, Programmer, Konten Edukatif Digital & Peneliti Muda Lapangan."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        const savedTheme = localStorage.getItem('azkaik-theme');
        const isDark = savedTheme ? savedTheme === 'dark' : true;
        document.documentElement.classList.toggle('dark', isDark);
        document.documentElement.classList.toggle('light', !isDark);
        const savedLang = localStorage.getItem('azkaik-lang');
        if (savedLang === 'en' || savedLang === 'id') {
          document.documentElement.lang = savedLang;
        }
      } catch {}
    </script>
  </head>
  <body class="bg-[#BDBDBD] text-[#0A0A0A] dark:bg-[#0F0F12] dark:text-slate-100 font-sans antialiased selection:bg-[#0059FF] selection:text-white transition-colors duration-300">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
